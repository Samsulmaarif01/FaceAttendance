<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face Attendance — Local Testing</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Face Attendance</h1>
    <span id="badge" class="badge">connecting…</span>
  </header>

  <main>
    <section class="panel video-panel">
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <img id="photo" alt="Uploaded image" hidden />
        <canvas id="overlay"></canvas>
        <div id="video-msg" class="video-msg">Camera off</div>
      </div>
      <div class="controls">
        <button id="btn-camera">Start camera</button>
        <label class="toggle">
          <input type="checkbox" id="chk-live" checked />
          Live recognition
        </label>
      </div>
      <div class="controls enroll">
        <input id="enroll-name" type="text" placeholder="Name (required to enroll)" />
        <input id="enroll-id" type="text" placeholder="User ID (optional)" />
        <button id="btn-enroll">Enroll captured face</button>
        <input id="upload" type="file" accept="image/*" hidden />
        <button id="btn-upload">Register from image…</button>
      </div>
      <p class="hint">
        Enroll captured face: registers the current webcam frame under the name above
        (needs the camera on). Register from image…: enrolls a face from a photo only —
        it never writes attendance.
      </p>
      <p id="status" class="status"></p>
    </section>

    <section class="panel">
      <h2>Stats</h2>
      <div class="stats" id="stats"></div>
      <h2>Users <span class="muted" id="users-count"></span></h2>
      <div class="table-wrap"><table id="users"><thead>
        <tr><th>ID</th><th>Name</th><th>Last</th><th></th></tr>
      </thead><tbody></tbody></table></div>
    </section>

    <section class="panel wide">
      <div class="row">
        <h2>Attendance <span class="muted" id="att-count"></span></h2>
        <div class="row-actions">
          <button id="btn-sync">Sync now</button>
          <button id="btn-clear-att" class="danger">Clear attendance</button>
        </div>
      </div>
      <div class="table-wrap"><table id="attendance"><thead>
        <tr><th>User</th><th>Timestamp</th><th>Similarity</th><th>Synced</th></tr>
      </thead><tbody></tbody></table></div>
    </section>
  </main>

  <canvas id="capture" hidden></canvas>
  <div id="toast" class="toast" hidden role="status" aria-live="polite">
    <div class="toast-icon" id="toast-icon">✓</div>
    <div class="toast-body">
      <div class="toast-title" id="toast-title"></div>
      <div class="toast-sub" id="toast-sub"></div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
